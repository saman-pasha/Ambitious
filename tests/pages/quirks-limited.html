<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html id=html><head><title>Quirks: limited-quirks mode</title>
<!-- XHTML 1.0 Transitional's DOCTYPE: a limited-quirks-mode page (HTML 13.2.6.4.1). Its one
     quirk is the line height calculation quirk (with the blocks ignore line-height quirk): no
     strut under an inline-block or an image alone on its line, an empty inline box's line
     height not counted. Quirks mode's other quirks are not its: the body's first p keeps its
     margin, the body and the html element do not fill the viewport, a percentage height is not
     taken through an auto one, a cell's height is its content box's, a table inherits the text
     around it, a nowrap cell may be narrower than its width, images in a cell wrap. -->
<style>
body { font: 16px sans-serif; }
div { margin: 0 0 4px; background: #eee; }
td { background: #ddd; }
.b { display: inline-block; width: 10px; height: 10px; background: #c00; }
</style></head><body id=body>
<p id=p1>The body's first p, its top margin kept</p>
<div id=d1><span class=b></span></div>
<div id=d2 style="line-height: 50px"><span style="line-height: 10px">text</span></div>
<div id=d3><span style="font-size: 40px"></span><span class=b></span></div>
<div id=d4><span style="font-size: 40px; padding-left: 1px"></span><span class=b></span></div>
<div id=d5 style="font-size: 40px"><span style="font-size: 10px">x</span></div>
<div id=d6 style="width: 30px"><span class=b></span> <span class=b></span> <span class=b></span></div>
<div id=d7><img id=g7 src="logo.png" width=20 height=20></div>
<div id=d8><div id=d8b style="height: 50%">50% of an auto height: auto</div></div>
<table id=t1><tr><td id=t1c><img id=t1i src="logo.png" width=20 height=20></td></tr></table>
<table id=t2><tr><td id=t2c style="height: 50px; padding: 10px">its height its content box's</td></tr></table>
<div style="font-size: 20px; line-height: 40px"><table id=t3><tr><td id=t3c>the text it inherits</td></tr></table></div>
<table id=t4 width=100><tr><td id=t4c nowrap style="width: 150px">aaa bbb</td><td id=t4d>x</td></tr></table>
<table id=t5 width=30><tr><td id=t5c><img id=t5i src="logo.png" width=20 height=20><img id=t5j src="logo.png" width=20 height=20></td></tr></table>
<p id=p2>A broken image <img id=g8 src="missing.png" alt="Sized" width=120 height=40> after</p>
<p id=p3>The body's last p</p>
</body></html>
