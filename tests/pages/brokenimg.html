<!DOCTYPE html>
<html lang="en"><head><title>Broken images</title><style>body { margin: 8px; font: 16px sans-serif; }</style></head>
<body>
<p id="p1">Before <img id="i1" src="missing.png" alt="Missing picture"> after.</p>
<p id="p2">Sized <img id="i2" src="missing.png" alt="Sized" width="120" height="40"> after.</p>
<p id="p3">No alt <img id="i3" src="missing.png"> after.</p>
<p id="p4">Empty alt <img id="i4" src="missing.png" alt=""> after.</p>
<p id="p5">Width only <img id="i5" src="missing.png" alt="W" width="80"> after.</p>
<p id="p6">Long alt <img id="i6" src="missing.png" alt="A rather long alternative text that may wrap onto another line when it is long enough"> after.</p>
<p id="p7">Block <img id="i7" src="missing.png" alt="Blocked" style="display:block"> after.</p>
</body></html>
