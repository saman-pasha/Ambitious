<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline SVG: text</title>
<style>
body { margin: 0; background: #fff }
svg { position: absolute }
.big { font-size: 28px; font-family: sans-serif }
</style>
</head>
<body>
<svg id="text-basic" style="left:10px;top:10px" width="240" height="60">
  <text x="10" y="40" font-size="24">Hello, SVG text</text>
</svg>
<svg id="text-anchor" style="left:270px;top:10px" width="240" height="100">
  <line x1="120" y1="0" x2="120" y2="100" stroke="#c0c0c0"/>
  <text x="120" y="25" font-size="18" text-anchor="start">start</text>
  <text x="120" y="55" font-size="18" text-anchor="middle">middle</text>
  <text x="120" y="85" font-size="18" text-anchor="end">end</text>
</svg>
<svg id="text-tspan" style="left:530px;top:10px" width="260" height="100">
  <text x="10" y="40" font-size="20" fill="#204080">One <tspan font-weight="bold" fill="#c03020">two</tspan>
    <tspan dy="20" dx="10" font-style="italic">three</tspan> four</text>
</svg>
<svg id="text-xlist" style="left:10px;top:130px" width="240" height="80">
  <text x="10 40 70 100 130" y="40" font-size="22">ABCDE</text>
  <text x="10" y="70" dx="0 5 10 15" font-size="16">wxyz</text>
</svg>
<svg id="text-family" style="left:270px;top:130px" width="240" height="110">
  <text x="10" y="30" font-size="20" font-family="serif">Serif face</text>
  <text x="10" y="60" class="big">Sans face</text>
  <text x="10" y="95" font-size="20" font-family="monospace">Mono face</text>
</svg>
<svg id="text-scaled" style="left:530px;top:130px" width="260" height="110" viewBox="0 0 130 55">
  <text x="5" y="25" font-size="16" fill="#105010">Scaled twice</text>
  <text x="5" y="48" font-size="12" style="fill: #801080">by a viewBox</text>
</svg>
<svg id="text-paint" style="left:10px;top:260px" width="380" height="80">
  <linearGradient id="tg"><stop offset="0" stop-color="#d02020"/><stop offset="1" stop-color="#2020d0"/></linearGradient>
  <text x="10" y="55" font-size="44" font-weight="bold" font-family="sans-serif" fill="url(#tg)">Gradient</text>
</svg>
<svg id="text-group" style="left:410px;top:260px" width="380" height="80">
  <g font-size="22" fill="#606060" transform="translate(20 0)">
    <text x="0" y="30">Inherited from a group</text>
    <text x="0" y="62" fill-opacity="0.5" letter-spacing="2">spaced, at half</text>
  </g>
</svg>
</body>
</html>
