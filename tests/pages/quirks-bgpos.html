<html><head><meta charset="utf-8"><title>background-position's unitless lengths drawn in quirks mode</title>
<style>body { margin: 0; } div { position: absolute; width: 90px; height: 70px; background: #eee url(logo.png) no-repeat; border: 1px solid #888; }</style></head><body>
<div id="d1" style="left:10px;top:10px;background-position:10 20"></div>
<div id="d2" style="left:120px;top:10px;background-position:left 15 top 5"></div>
<div id="d3" style="left:230px;top:10px;background-position:right 10 bottom 5"></div>
<div id="d4" style="left:340px;top:10px;background-position:25"></div>
<div id="d5" style="left:450px;top:10px;background-position:-8 12"></div>
<div id="d6" style="left:10px;top:100px;background:#eee url(logo.png) no-repeat 10 20"></div>
<div id="d7" style="left:120px;top:100px;background-position:10px 20"></div>
</body></html>
