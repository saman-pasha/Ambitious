<!DOCTYPE html>
<html lang="en"><head><title>Inline decorations</title>
<style>
body { margin: 20px; font: 20px/1.6 sans-serif; }
span { color: transparent; }
#pill { border: 3px solid #c00; border-radius: 10px; padding: 2px 8px; background: #fde; }
#grad { background: linear-gradient(90deg, #ff0, #0cf); }
#img { background: url(logo.png) no-repeat 0 50%; padding-left: 100px; }
#round { background: #036; border-radius: 6px; padding: 1px 6px; }
#shadow { background: #ffc; box-shadow: 3px 3px 0 #999; }
#wrap { border: 2px solid #06c; background: linear-gradient(#cfc, #9c9); }
#thick { border-width: 4px 8px; border-style: solid; border-color: #fa0 #0a0 #00f #f0f; padding: 0 4px; }
</style></head>
<body>
<div>Text <span id="pill">a pill</span> and <span id="grad">a gradient span</span> here.</div>
<div><span id="img">after an image</span> and <span id="round">rounded</span> and <span id="shadow">shadowed</span>.</div>
<div style="width: 300px"><span id="wrap">This inline element breaks across more than one line, with a border and a gradient.</span></div>
<div>And <span id="thick">four colours of border</span>.</div>
</body></html>
