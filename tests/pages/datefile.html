<!DOCTYPE html>
<html lang="en"><head><title>File and date controls</title><style>body { margin: 8px; } div { margin: 0 0 4px; }</style></head>
<body>
<div><input id="f1" type="file"></div>
<div><input id="f2" type="file" multiple></div>
<div><input id="f3" type="file" disabled></div>
<div><input id="d1" type="date"></div>
<div><input id="d2" type="date" value="2024-03-15"></div>
<div><input id="d3" type="time"></div>
<div><input id="d4" type="time" value="13:45"></div>
<div><input id="d5" type="datetime-local"></div>
<div><input id="d6" type="month"></div>
<div><input id="d7" type="week"></div>
<div><input id="d8" type="date" disabled></div>
<div><input id="d9" type="month" value="2024-03"></div>
<div><input id="d10" type="week" value="2024-W11"></div>
<div><input id="d11" type="datetime-local" value="2024-03-15T09:05"></div>
<div><input id="d12" type="time" value="00:00:30"></div>
<div><input id="e1" type="date" readonly value="2024-01-02"> <input id="e2" type="date" style="border-radius: 4px"> <input id="e3" type="time" style="appearance: none"></div>
<div><input id="e4" type="date" style="font-size: 20px"> <input id="e5" type="time" step="1"> <input id="e6" type="time" step="0.001" value="23:59:59.5"></div>
<div><input id="e7" type="date" style="width: 200px"> <input id="e8" type="date" value="2024-02-30"> <input id="e9" type="datetime-local" value="2024-12-31 23:59:58"></div>
<div><input id="e10" type="month" value="2024-05"> <input id="e11" type="week" value="2020-W53"> <input id="e12" type="week" value="2021-W53"></div>
<div style="color-scheme: dark"><input id="k1" type="date"> <input id="k2" type="time" value="08:00"> <input id="k3" type="file"> <input id="k4" type="date" disabled></div>
<div><input id="g1" type="file" style="font-size: 18px"> <input id="g2" type="file" style="color: red"></div>
</body></html>
