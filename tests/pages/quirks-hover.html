     and :hover quirk (the Quirks Mode Standard 4.1). A compound of :hover alone (or with *) holds
     of links alone: not of the div or the span that are hovered, but of the link between them;
     a type, a class, an attribute, another pseudo-class or a functional pseudo-class's argument

     Chromium's computed values with the mouse over #s1 (tests/integ/cssref.sh). -->

body :hover { margin-left: 1px }
:hover > span { padding-left: 2px }
