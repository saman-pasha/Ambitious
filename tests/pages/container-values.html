<!DOCTYPE html>
<html lang="en"><head><title>Container queries: computed values</title>
<style>
/* tests/pages/container-values.html -- container-type, container-name and the container shorthand as Chromium computes
   them; the container units against each axis's nearest container (the small viewport's without one, a container's own
   units against its ancestors'); which container a query asks (its name, the axes its features need, a container with
   no box) and what each query answers: range and plain syntax, and, or, not, em in a query, style queries
   (tests/integ/cssref.sh) */
body { margin: 8px; font: 16px sans-serif; }
.ci { container-type: inline-size; }
.cs { container-type: size; }
.u { width: 10cqw; height: 10cqh; margin-left: 10cqi; padding-top: 10cqb; margin-top: 10cqmin; margin-bottom: 10cqmax; font-size: 5cqw; }
@container (width > 500px) { .q1 { color: rgb(255, 0, 0); } }
@container (min-width: 500px) { .q2 { color: rgb(0, 128, 0); } }
@container (300px < width < 500px) { .q3 { color: rgb(0, 0, 255); } }
@container (height > 50px) { .q4 { color: rgb(1, 2, 3); } }
@container (width > 10em) { .q5 { color: rgb(4, 5, 6); } }
@container (orientation: landscape) { .q6 { color: rgb(7, 8, 9); } }
@container (aspect-ratio > 2) { .q7 { color: rgb(10, 11, 12); } }
@container not (width > 500px) { .q8 { color: rgb(13, 14, 15); } }
@container (width > 100px) and (width < 200px) { .q9 { color: rgb(16, 17, 18); } }
@container (width < 100px) or (width > 700px) { .q10 { color: rgb(19, 20, 21); } }
@container card (width > 0px) { .q11 { color: rgb(22, 23, 24); } }
@container card { .q12 { color: rgb(25, 26, 27); } }
@container (inline-size > 500px) { .q13 { color: rgb(28, 29, 30); } }
@container (block-size > 50px) { .q14 { color: rgb(31, 32, 33); } }
@container (foo > 1px) { .q15 { color: rgb(34, 35, 36); } }
@container (width > 500px) { @container (width < 800px) { .q16 { color: rgb(37, 38, 39); } } }
@container style(--t: dark) { .q19 { color: rgb(46, 47, 48); } }
@container (width: 784px) { .q20 { color: rgb(49, 50, 51); } }
@container (784px <= width) { .q22 { color: rgb(55, 56, 57); } }
@container (max-width: 784px) { .q23 { color: rgb(58, 59, 60); } }
@container (width > 500px) and (height > 0px) { .q24 { color: rgb(61, 62, 63); } }
@container (width > 500px) or (height > 0px) { .q25 { color: rgb(64, 65, 66); } }
@container not (height > 0px) { .q27 { color: rgb(70, 71, 72); } }
@container (width > 300px) and (width > 1px) or (width > 2px) { .q30 { color: rgb(73, 74, 75); } }
@container (not (width < 300px)) and (width > 1px) { .q32 { color: rgb(76, 77, 78); } }
@container (width > 1px), (height > 1px) { .q33 { color: rgb(79, 80, 81); } }
@container (width) { .q34 { color: rgb(82, 83, 84); } }
@container NAMED (width > 1px) { .q35 { color: rgb(85, 86, 87); } }
@container none (width > 1px) { .q36 { color: rgb(88, 89, 90); } }
@container style(--t) { .q37 { color: rgb(91, 92, 93); } }
@container style(--sp: a  b) { .q38 { color: rgb(94, 95, 96); } }
@container named style(--t: dark) { .q39 { color: rgb(97, 98, 99); } }
@container not style(--t: light) { .q40 { color: rgb(100, 101, 102); } }
@container (width > 300px) { .q41::before { content: "x"; color: rgb(103, 104, 105); } }
</style></head>
