<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline SVG: gradients and clipping</title>
<style>
body { margin: 0; background: #fff }
svg { position: absolute }
.stop1 { stop-color: #f0d000 }
</style>
</head>
<body>
<svg id="defs" style="left:0;top:0" width="0" height="0">
  <defs>
    <linearGradient id="lg1"><stop offset="0" stop-color="#d02020"/><stop offset="0.5" stop-color="#f0e040"/><stop offset="1" stop-color="#2040d0"/></linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="10%" stop-color="#000"/><stop offset="90%" stop-color="#fff"/></linearGradient>
    <linearGradient id="lg3" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="45" y2="0" spreadMethod="reflect" gradientTransform="rotate(30 50 50)">
      <stop offset="0" stop-color="#208040"/><stop offset="1" stop-color="#e0f0e0"/></linearGradient>
    <linearGradient id="lg4" x1="0.3" x2="0.5" spreadMethod="repeat"><stop offset="0" stop-color="#4040c0"/><stop offset="1" stop-color="#c0c0f0"/></linearGradient>
    <radialGradient id="rg1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a02060"/></radialGradient>
    <radialGradient id="rg2" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3" fr="0.05"><stop offset="0" stop-color="#ffe0a0"/><stop offset="0.7" stop-color="#d06000"/><stop offset="1" stop-color="#401000"/></radialGradient>
    <linearGradient id="lg5" href="#lg1" x2="0" y2="1"/>
    <linearGradient id="lg6" xlink:href="#lg5" gradientTransform="translate(0.25 0)"/>
    <linearGradient id="lg7"><stop offset="0" class="stop1"/><stop offset="1" stop-color="#3060f0" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="lg8"><stop offset="0" stop-color="#20a0a0"/></linearGradient>
    <linearGradient id="lg9"></linearGradient>
    <radialGradient id="rg3" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="20" spreadMethod="repeat"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
    <clipPath id="cp1"><circle cx="50" cy="50" r="40"/></clipPath>
    <clipPath id="cp2" clip-rule="evenodd"><path d="M50 5 L 79 95 L 2 39 L 98 39 L 21 95 Z"/></clipPath>
    <clipPath id="cp3" clipPathUnits="objectBoundingBox"><rect x="0.1" y="0.1" width="0.4" height="0.8"/><circle cx="0.75" cy="0.5" r="0.25"/></clipPath>
    <clipPath id="cp4" transform="translate(10 10)"><rect x="0" y="0" width="50" height="50"/></clipPath>
    <rect id="cpr" x="20" y="20" width="60" height="30"/>
    <clipPath id="cp5"><use href="#cpr"/><use href="#cpr" x="0" y="35"/></clipPath>
    <clipPath id="cp6" clip-path="url(#cp1)"><rect x="0" y="0" width="60" height="100"/></clipPath>
  </defs>
</svg>
<!-- row 1: linear gradients -->
<svg id="s-lg1" style="left:5px;top:5px" width="100" height="100"><rect x="5" y="5" width="90" height="90" fill="url(#lg1)"/></svg>
<svg id="s-lg2" style="left:117px;top:5px" width="100" height="100"><rect x="5" y="20" width="90" height="60" fill="url(#lg2)" stroke="#000"/></svg>
<svg id="s-lg3" style="left:229px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="url(#lg3)"/></svg>
<svg id="s-lg4" style="left:341px;top:5px" width="100" height="100"><circle cx="50" cy="50" r="45" fill="url(#lg4)"/></svg>
<svg id="s-lg5" style="left:453px;top:5px" width="100" height="100"><rect x="10" y="10" width="35" height="80" fill="url(#lg5)"/><rect x="55" y="10" width="35" height="80" fill="url(#lg6)"/></svg>
<svg id="s-lg7" style="left:565px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#000"/><rect x="10" y="10" width="80" height="80" fill="url(#lg7)" fill-opacity="0.8"/></svg>
<svg id="s-solid" style="left:677px;top:5px" width="100" height="100">
  <rect x="10" y="10" width="35" height="35" fill="url(#lg8)"/>
  <rect x="55" y="10" width="35" height="35" fill="url(#lg9)" stroke="#000"/>
  <rect x="10" y="55" width="35" height="35" fill="url(#missing) #c04040"/>
  <rect x="55" y="55" width="35" height="35" fill="url(#missing)" stroke="#000"/>
</svg>
<!-- row 2: radial gradients, gradient strokes -->
<svg id="s-rg1" style="left:5px;top:117px" width="100" height="100"><circle cx="50" cy="50" r="45" fill="url(#rg1)"/></svg>
<svg id="s-rg2" style="left:117px;top:117px" width="100" height="100"><rect x="5" y="5" width="90" height="90" fill="url(#rg2)"/></svg>
<svg id="s-rg3" style="left:229px;top:117px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="url(#rg3)"/></svg>
<svg id="s-rg4" style="left:341px;top:117px" width="100" height="100"><ellipse cx="50" cy="50" rx="45" ry="25" fill="url(#rg1)"/></svg>
<svg id="s-gstroke" style="left:453px;top:117px" width="100" height="100">
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#lg1)" stroke-width="12"/>
  <line x1="10" y1="92" x2="90" y2="92" stroke="url(#lg2)" stroke-width="6"/>
</svg>
<svg id="s-gtrans" style="left:565px;top:117px" width="100" height="100">
  <g transform="rotate(20 50 50)"><rect x="15" y="25" width="70" height="50" fill="url(#lg1)"/></g>
</svg>
<!-- row 3: clipping -->
<svg id="s-cp1" style="left:5px;top:229px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#3070d0" clip-path="url(#cp1)"/></svg>
<svg id="s-cp2" style="left:117px;top:229px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="url(#lg1)" clip-path="url(#cp2)"/></svg>
<svg id="s-cp3" style="left:229px;top:229px" width="100" height="100"><rect x="5" y="20" width="90" height="60" fill="#d07030" clip-path="url(#cp3)"/></svg>
<svg id="s-cp4" style="left:341px;top:229px" width="100" height="100">
  <g clip-path="url(#cp4)" transform="translate(20 20)"><circle cx="30" cy="30" r="30" fill="#30a060"/><rect x="40" y="0" width="40" height="40" fill="#a03060"/></g>
</svg>
<svg id="s-cp5" style="left:453px;top:229px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#6040a0" clip-path="url(#cp5)"/></svg>
<svg id="s-cp6" style="left:565px;top:229px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#2090b0" clip-path="url(#cp6)"/></svg>
<svg id="s-cpop" style="left:677px;top:229px" width="100" height="100">
  <rect x="0" y="40" width="100" height="20" fill="#000"/>
  <g opacity="0.6" clip-path="url(#cp1)"><rect x="0" y="0" width="100" height="100" fill="#e04020"/><rect x="20" y="20" width="60" height="60" fill="#2040e0"/></g>
</svg>
</body>
</html>
