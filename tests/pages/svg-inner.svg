<?xml version="1.0" encoding="UTF-8"?>
<!-- an SVG document drawn as an image (tests/pages/svg-broken.html): its image elements fetch nothing
     but a data: URL (logo.png and missing.png draw nothing, not even the broken image), and the
     filter primitives drawn in it as inline -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="100">
  <defs>
    <filter id="t" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3"/></filter>
    <filter id="m"><feMorphology operator="dilate" radius="3"/></filter>
    <filter id="l" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feSpecularLighting in="b" surfaceScale="4" specularExponent="12" lighting-color="#fff"><fePointLight x="150" y="55" z="30"/></feSpecularLighting></filter>
    <filter id="i" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAKklEQVR4nGPU0Djxn4GBgWEBQwIDAwMDAxMDGmA8oaHxH1kARUVCBUMjAAe8Bo6g1IhoAAAAAElFTkSuQmCC" preserveAspectRatio="none"/></filter>
  </defs>
  <rect width="200" height="100" fill="#eee"/>
  <image href="logo.png" x="5" y="5" width="96" height="32"/>
  <image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAKklEQVR4nGPU0Djxn4GBgWEBQwIDAwMDAxMDGmA8oaHxH1kARUVCBUMjAAe8Bo6g1IhoAAAAAElFTkSuQmCC" x="110" y="5" width="40" height="40"/>
  <image href="missing.png" x="5" y="50" width="60" height="40"/>
  <rect x="70" y="50" width="40" height="40" filter="url(#t)"/>
  <rect x="160" y="10" width="20" height="20" fill="#c06030" filter="url(#m)"/>
  <rect x="120" y="55" width="70" height="40" rx="10" filter="url(#l)"/>
  <rect x="5" y="40" width="30" height="8" filter="url(#i)"/>
</svg>
