<!DOCTYPE html>
<html lang="en"><head><title>object-fit and object-position on SVG images</title>
<style>
body { margin: 0; font: 16px serif; }
div { position: absolute; }
img { display: block; width: 80px; height: 80px; background: #ddd; }
</style></head>
<body>
<!-- svg-badge.svg: a natural size of 120 x 60 -->
<div style="left:10px;top:10px"><img id="b1" src="svg-badge.svg"></div>
<div style="left:110px;top:10px"><img id="b2" src="svg-badge.svg" style="object-fit:contain"></div>
<div style="left:210px;top:10px"><img id="b3" src="svg-badge.svg" style="object-fit:cover"></div>
<div style="left:310px;top:10px"><img id="b4" src="svg-badge.svg" style="object-fit:none"></div>
<div style="left:410px;top:10px"><img id="b5" src="svg-badge.svg" style="object-fit:scale-down"></div>
<div style="left:510px;top:10px"><img id="b6" src="svg-badge.svg" style="object-fit:scale-down;width:150px"></div>
<div style="left:680px;top:10px"><img id="b7" src="svg-badge.svg" style="object-fit:cover;object-position:left top"></div>
<div style="left:10px;top:110px"><img id="b8" src="svg-badge.svg" style="object-fit:contain;object-position:right bottom"></div>
<div style="left:110px;top:110px"><img id="b9" src="svg-badge.svg" style="object-fit:none;object-position:10px 5px"></div>
<div style="left:210px;top:110px"><img id="b10" src="svg-badge.svg" style="object-fit:contain;padding:5px;border:2px solid navy"></div>
<div style="left:320px;top:110px"><img id="b11" src="svg-badge.svg" style="object-fit:cover;width:60px;height:60px;border-radius:50%"></div>
<div style="left:400px;top:110px"><img id="b12" src="svg-badge.svg" style="object-fit:contain;width:90px;height:30px"></div>
<div style="left:510px;top:110px"><img id="b13" src="svg-badge.svg" style="object-fit:fill;object-position:left top"></div>
<div style="left:610px;top:110px"><img id="b14" src="svg-badge.svg" style="object-fit:cover;object-position:25% 75%;width:50px;height:90px"></div>
<!-- svg-ratio.svg: no natural size, a ratio of 2 : 1 (its viewBox) -->
<div style="left:10px;top:230px"><img id="r1" src="svg-ratio.svg"></div>
<div style="left:110px;top:230px"><img id="r2" src="svg-ratio.svg" style="object-fit:contain"></div>
<div style="left:210px;top:230px"><img id="r3" src="svg-ratio.svg" style="object-fit:cover"></div>
<div style="left:310px;top:230px"><img id="r4" src="svg-ratio.svg" style="object-fit:none"></div>
<div style="left:410px;top:230px"><img id="r5" src="svg-ratio.svg" style="object-fit:scale-down"></div>
<div style="left:510px;top:230px"><img id="r6" src="svg-ratio.svg" style="object-fit:cover;object-position:right top"></div>
<div style="left:610px;top:230px"><img id="r7" src="svg-ratio.svg" style="object-fit:contain;object-position:left bottom;width:60px;height:90px"></div>
</body></html>
