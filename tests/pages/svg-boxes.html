<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline SVG: text's and images' boxes, CSS's filter functions</title>
<style>
body { margin: 0; background: #fff }
svg { position: absolute }
.blur { filter: blur(3px) }
.shadow { filter: drop-shadow(3px 4px 2px rgba(0, 0, 80, 0.7)) }
.grey { filter: grayscale(100%) }
.hue { filter: hue-rotate(120deg) }
.bright { filter: brightness(1.6) }
.contrast { filter: contrast(40%) }
.invert { filter: invert(0.8) }
.faint { filter: opacity(0.4) }
.saturate { filter: saturate(3) }
.sepia { filter: sepia(1) }
.chain { filter: sepia(0.6) blur(1.5px) drop-shadow(-3px -3px 0px #20a0a0) }
</style>
</head>
<body>
<svg id="defs" style="left:0;top:0" width="0" height="0">
  <defs>
    <filter id="fs"><feDropShadow dx="3" dy="3" stdDeviation="1.5" flood-color="#000"/></filter>
    <mask id="mb" maskContentUnits="objectBoundingBox"><rect x="0" y="0" width="0.5" height="1" fill="#fff"/></mask>
    <clipPath id="cb" clipPathUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.5"/></clipPath>
    <linearGradient id="gb"><stop offset="0" stop-color="#e02020"/><stop offset="1" stop-color="#2020e0"/></linearGradient>
  </defs>
</svg>
<!-- row 1: text and images by their bounding boxes -->
<svg id="b-textfilter" style="left:5px;top:5px" width="100" height="100"><text x="10" y="50" font-size="30" fill="#c04040" filter="url(#fs)">Fx</text></svg>
<svg id="b-textmask" style="left:117px;top:5px" width="100" height="100"><text x="10" y="50" font-size="30" fill="#4040c0" mask="url(#mb)">Mask</text></svg>
<svg id="b-textclip" style="left:229px;top:5px" width="100" height="100"><text x="5" y="60" font-size="40" fill="#40a040" clip-path="url(#cb)">Clip</text></svg>
<svg id="b-imagemask" style="left:341px;top:5px" width="100" height="100"><image href="logo.png" x="2" y="30" width="96" height="32" mask="url(#mb)"/></svg>
<svg id="b-imagefilter" style="left:453px;top:5px" width="100" height="100"><image href="logo.png" x="2" y="30" width="96" height="32" filter="url(#fs)"/></svg>
<svg id="b-group" style="left:565px;top:5px" width="100" height="100"><g filter="url(#fs)"><text x="10" y="40" font-size="20">Grp</text><rect x="10" y="60" width="30" height="20" fill="#2080a0"/></g></svg>
<svg id="b-gradtext" style="left:677px;top:5px" width="100" height="100"><text x="5" y="60" font-size="44" font-weight="bold" font-family="sans-serif" fill="url(#gb)" transform="rotate(-10 50 50)">Gr</text></svg>
<!-- rows 2 and 3: CSS's filter functions on SVG elements -->
<svg id="c-blur" style="left:5px;top:117px" width="100" height="100"><rect class="blur" x="20" y="20" width="60" height="60" fill="#806020"/></svg>
<svg id="c-shadow" style="left:117px;top:117px" width="100" height="100"><circle class="shadow" cx="45" cy="45" r="30" fill="#e0a020"/></svg>
<svg id="c-grey" style="left:229px;top:117px" width="100" height="100"><rect class="grey" x="10" y="10" width="80" height="80" fill="url(#gb)"/></svg>
<svg id="c-hue" style="left:341px;top:117px" width="100" height="100"><rect class="hue" x="10" y="10" width="80" height="80" fill="url(#gb)"/></svg>
<svg id="c-bright" style="left:453px;top:117px" width="100" height="100"><rect class="bright" x="10" y="10" width="80" height="80" fill="#605040"/></svg>
<svg id="c-contrast" style="left:565px;top:117px" width="100" height="100"><rect class="contrast" x="10" y="10" width="80" height="80" fill="url(#gb)"/></svg>
<svg id="c-invert" style="left:677px;top:117px" width="100" height="100"><rect class="invert" x="10" y="10" width="80" height="80" fill="#3080c0"/></svg>
<svg id="c-faint" style="left:5px;top:229px" width="100" height="100"><rect class="faint" x="10" y="10" width="80" height="80" fill="#3080c0"/></svg>
<svg id="c-saturate" style="left:117px;top:229px" width="100" height="100"><rect class="saturate" x="10" y="10" width="80" height="80" fill="#a08070"/></svg>
<svg id="c-sepia" style="left:229px;top:229px" width="100" height="100"><rect class="sepia" x="10" y="10" width="80" height="80" fill="#3080c0"/></svg>
<svg id="c-chain" style="left:341px;top:229px" width="100" height="100"><g class="chain"><rect x="25" y="25" width="50" height="50" fill="#3080c0"/></g></svg>
</body>
</html>
