<!DOCTYPE html>
<html lang="en">
<head>
<title>Live regions</title>
<style>.gone { display: none }</style>
</head>
<body>
<!-- tests/pages/a11y-live.html: live regions, by aria-live and by role, with aria-atomic, aria-relevant and
     aria-busy; and hidden content, kept by its root with what in it takes focus or is a live region.
     tests/integ/a11y-chromium.sh holds Ambitious's tree of it to Chromium's (a11y-live.chromium);
     tests/integ/a11y-facts.sh asks for the regions each node is in -->
<main>
<h1 id="title">Live regions</h1>
<div id="feed" aria-live="polite"><p id="feed-text">New messages appear here</p>
<div role="status" id="feed-status">2 unread</div>
<button id="feed-button">Mark as read</button></div>
<div id="urgent" aria-live="assertive" aria-atomic="true" aria-relevant="all">Connection lost</div>
<div id="quiet" aria-live="off"><p id="quiet-text">Not announced</p></div>
<div id="changes" aria-live="polite" aria-relevant="additions removals">Changes</div>
<div role="alert" id="alert">Saved</div>
<div role="status" id="status" aria-atomic="false">3 items</div>
<div role="log" id="log"><p id="log-line">Line one</p></div>
<div role="marquee" id="ticker">Prices</div>
<div role="timer" id="timer">00:30</div>
<output id="sum">42</output>
<div role="region" id="busy" aria-label="Results" aria-busy="true" aria-live="polite"><p id="busy-text">Loading</p></div>

<div id="covered" aria-hidden="true">
<button id="covered-button">Hidden button</button>
<a href="#title" id="covered-link">Hidden link</a>
<div id="covered-minus" tabindex="-1">Out of the tab order</div>
<div class="gone"><button id="covered-gone">Not drawn</button></div>
<div role="alert" id="covered-alert">Never heard</div>
</div>
<button id="hidden-button" aria-hidden="true">Hidden itself</button>
<div id="later" class="gone" aria-live="polite">Shown later</div>
<div id="tucked" hidden><div role="status" id="tucked-status">Tucked away</div></div>
</main>
</body>
</html>
