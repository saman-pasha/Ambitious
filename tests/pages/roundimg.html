<!DOCTYPE html>
<html lang="en"><head><title>Rounded images</title>
<style>
body { margin: 0; font: 16px serif; }
div { position: absolute; }
img { display: block; }
</style></head>
<body>
<div style="left:10px;top:10px"><img id="r1" src="logo.png" style="width:60px;height:60px;border-radius:50%"></div>
<div style="left:90px;top:10px"><img id="r2" src="logo.png" style="width:60px;height:60px;border-radius:12px;border:4px solid red;padding:3px"></div>
<div style="left:180px;top:10px"><img id="r3" src="logo.png" style="width:96px;height:32px;border-radius:16px 4px"></div>
<div style="left:290px;top:10px"><img id="r4" src="svg-badge.svg" style="width:60px;height:60px;border-radius:50%"></div>
<div style="left:370px;top:10px"><img id="r5" src="logo.png" style="width:60px;height:40px;border-radius:20px / 10px;background:navy;padding:6px"></div>
<div style="left:460px;top:10px"><img id="r6" src="logo.png" style="width:80px;height:50px;border-radius:50%"></div>
<div style="left:10px;top:100px"><img id="r7" src="logo.png" style="width:60px;height:60px;border-radius:50%;opacity:0.5"></div>
<div style="left:90px;top:100px"><img id="r8" src="logo.png" style="width:60px;height:60px;border-radius:30px;border:2px solid green"></div>
<div style="left:180px;top:100px"><img id="r9" width="40" height="30" style="border-radius:10px;background:yellow"></div>
<div style="left:240px;top:100px"><svg id="r10" width="60" height="60" style="border-radius:50%;display:block"><rect width="60" height="60" fill="teal"/></svg></div>
</body></html>
