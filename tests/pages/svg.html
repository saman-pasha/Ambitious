<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline SVG: shapes, paths, strokes, structure, styles</title>
<style>
body { margin: 0; background: #fff }
svg { position: absolute }
.warm { fill: #e07020; stroke: #402010 }
#s-css .big { stroke-width: 6 }
#s-css rect:nth-child(3) { fill: teal }
.tinted { color: #2060c0 }
</style>
</head>
<body>
<!-- row 1: the basic shapes -->
<svg id="s-rect" style="left:5px;top:5px" width="100" height="100">
  <rect x="10" y="10" width="80" height="50" fill="#3070d0"/>
  <rect x="20.5" y="70.5" width="60" height="20" fill="none" stroke="#c03030" stroke-width="3"/>
</svg>
<svg id="s-rrect" style="left:117px;top:5px" width="100" height="100">
  <rect x="10" y="10" width="80" height="40" rx="12" fill="#50a050" stroke="#204020" stroke-width="4"/>
  <rect x="15" y="60" width="70" height="30" rx="20" ry="8" fill="#a050a0"/>
</svg>
<svg id="s-circle" style="left:229px;top:5px" width="100" height="100">
  <circle cx="50" cy="50" r="38" fill="#f0c020" stroke="#806000" stroke-width="6"/>
  <circle cx="50" cy="50" r="12" fill="#ffffff"/>
</svg>
<svg id="s-ellipse" style="left:341px;top:5px" width="100" height="100">
  <ellipse cx="50" cy="30" rx="45" ry="20" fill="#20a0a0"/>
  <ellipse cx="50" cy="75" rx="25" ry="20" fill="none" stroke="#a02060" stroke-width="5"/>
</svg>
<svg id="s-line" style="left:453px;top:5px" width="100" height="100">
  <line x1="15" y1="15" x2="85" y2="15" stroke="#000" stroke-width="10"/>
  <line x1="15" y1="40" x2="85" y2="40" stroke="#000" stroke-width="10" stroke-linecap="round"/>
  <line x1="15" y1="65" x2="85" y2="65" stroke="#000" stroke-width="10" stroke-linecap="square"/>
  <line x1="10" y1="80" x2="90" y2="95" stroke="#3050c0" stroke-width="4"/>
</svg>
<svg id="s-polyline" style="left:565px;top:5px" width="100" height="100">
  <polyline points="10,90 30,20 50,70 70,10 90,60" fill="none" stroke="#2050a0" stroke-width="6"/>
</svg>
<svg id="s-polygon" style="left:677px;top:5px" width="100" height="100">
  <polygon points="50,5 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill="#e04040" stroke="#600000" stroke-width="2"/>
</svg>
<!-- row 2: paths -->
<svg id="s-curves" style="left:5px;top:117px" width="100" height="100">
  <path d="M10 80 C 20 10, 50 10, 50 50 S 80 90, 90 20" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M10 95 Q 30 60 50 95 T 90 95" fill="#80c0f0" stroke="#004080" stroke-width="2"/>
</svg>
<svg id="s-arcs" style="left:117px;top:117px" width="100" height="100">
  <path d="M10 50 A 20 20 0 0 1 50 50 A 20 30 30 1 0 90 50" fill="none" stroke="#a03000" stroke-width="3"/>
  <path d="M20 90 a15 10 0 1 1 30 0 l 10 -20 a10 10 0 0 0 20 0 z" fill="#f0a060" stroke="#603000" stroke-width="2"/>
</svg>
<svg id="s-relative" style="left:229px;top:117px" width="100" height="100">
  <path d="m10 10h30v20h-20zm40 0 20 0 10 10 0 10-10 10z" fill="#60a030" stroke="#204010" stroke-width="2"/>
  <path d="M10 60l15-10 15 10 15-10 15 10 15-10V90H10Z" fill="#3060a0"/>
  <path d="M60 30a10 10 0 1 0.1.1.5.5" fill="none" stroke="#000"/>
</svg>
<svg id="s-fillrule" style="left:341px;top:117px" width="100" height="100">
  <path d="M5 5 H 95 V 45 H 5 Z M 25 15 H 75 V 35 H 25 Z" fill="#3070d0" fill-rule="evenodd"/>
  <path d="M5 55 H 95 V 95 H 5 Z M 25 65 H 75 V 85 H 25 Z" fill="#d07030" fill-rule="nonzero"/>
  <path d="M50 50 m -10 0 a 10 10 0 1 0 20 0 a 10 10 0 1 0 -20 0 z" fill="#000" fill-rule="evenodd"/>
</svg>
<svg id="s-joins" style="left:453px;top:117px" width="100" height="100">
  <polyline points="10,35 30,10 50,35" fill="none" stroke="#000" stroke-width="8" stroke-linejoin="miter"/>
  <polyline points="55,35 75,10 95,35" fill="none" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <polyline points="10,90 30,60 50,90" fill="none" stroke="#000" stroke-width="8" stroke-linejoin="bevel"/>
  <polyline points="55,90 75,55 95,90" fill="none" stroke="#000" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="1.5"/>
</svg>
<svg id="s-caps" style="left:565px;top:117px" width="100" height="100">
  <path d="M20 20 L 20 20" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M50 20 L 50 20" stroke="#000" stroke-width="12" stroke-linecap="square"/>
  <path d="M80 20 L 80 20" stroke="#000" stroke-width="12" stroke-linecap="butt"/>
  <path d="M10 50 L 90 80 M 10 80 L 90 50" stroke="#2050a0" stroke-width="8" stroke-linecap="round"/>
</svg>
<svg id="s-dashes" style="left:677px;top:117px" width="100" height="100">
  <line x1="5" y1="10" x2="95" y2="10" stroke="#000" stroke-width="4" stroke-dasharray="10 5"/>
  <line x1="5" y1="25" x2="95" y2="25" stroke="#000" stroke-width="4" stroke-dasharray="10 5" stroke-dashoffset="7"/>
  <line x1="5" y1="40" x2="95" y2="40" stroke="#000" stroke-width="4" stroke-dasharray="15 5 5"/>
  <line x1="5" y1="55" x2="95" y2="55" stroke="#c03000" stroke-width="6" stroke-dasharray="0 12" stroke-linecap="round"/>
  <rect x="10" y="68" width="80" height="25" fill="none" stroke="#2050a0" stroke-width="3" stroke-dasharray="12 6"/>
</svg>
<!-- row 3: dashes on curves, opacity, transforms -->
<svg id="s-dash-curve" style="left:5px;top:229px" width="100" height="100">
  <circle cx="50" cy="50" r="35" fill="none" stroke="#305080" stroke-width="6" stroke-dasharray="20 8" stroke-dashoffset="5"/>
  <path d="M20 50 Q 50 0 80 50" fill="none" stroke="#a03000" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
</svg>
<svg id="s-opacity" style="left:117px;top:229px" width="100" height="100">
  <rect x="10" y="10" width="60" height="60" fill="#d02020" fill-opacity="0.6" stroke="#000" stroke-width="10" stroke-opacity="0.4"/>
  <circle cx="65" cy="65" r="30" fill="#2040d0" opacity="0.5" stroke="#000" stroke-width="8"/>
</svg>
<svg id="s-group-opacity" style="left:229px;top:229px" width="100" height="100">
  <g opacity="0.5">
    <rect x="10" y="10" width="60" height="60" fill="#20a020"/>
    <rect x="30" y="30" width="60" height="60" fill="#a02020"/>
  </g>
  <g fill-opacity="0.5">
    <circle cx="20" cy="80" r="15" fill="#000"/>
    <circle cx="35" cy="80" r="15" fill="#000"/>
  </g>
</svg>
<svg id="s-transform" style="left:341px;top:229px" width="100" height="100">
  <rect x="0" y="0" width="20" height="20" fill="#d04040" transform="translate(10 10)"/>
  <rect x="0" y="0" width="20" height="20" fill="#40a040" transform="translate(40,10) scale(1.5 1)"/>
  <rect x="70" y="10" width="20" height="20" fill="#4040d0" transform="rotate(30 80 20)"/>
  <rect x="10" y="50" width="20" height="20" fill="#a0a020" transform="skewX(20)"/>
  <rect x="40" y="45" width="20" height="20" fill="#20a0a0" transform="skewY(15)"/>
  <rect x="0" y="0" width="20" height="20" fill="#a020a0" transform="matrix(0.8 0.3 -0.3 0.8 75 55)"/>
</svg>
<svg id="s-groups" style="left:453px;top:229px" width="100" height="100">
  <g transform="translate(50 50)" fill="#2060a0">
    <g transform="rotate(45)">
      <rect x="-30" y="-6" width="60" height="12"/>
      <rect x="-6" y="-30" width="12" height="60" fill="#a06020"/>
    </g>
    <circle r="8" fill="#fff" stroke="#000" stroke-width="2"/>
  </g>
</svg>
<svg id="s-stroke-scale" style="left:565px;top:229px" width="100" height="100">
  <g transform="scale(3 1)">
    <circle cx="16" cy="50" r="10" fill="none" stroke="#000" stroke-width="4"/>
  </g>
  <rect x="10" y="80" width="80" height="10" fill="none" stroke="#c03000" stroke-width="2" transform="rotate(-5 50 85)"/>
</svg>
<svg id="s-thin" style="left:677px;top:229px" width="100" height="100">
  <line x1="10" y1="10.5" x2="90" y2="10.5" stroke="#000" stroke-width="1"/>
  <line x1="10" y1="20" x2="90" y2="20" stroke="#000" stroke-width="1"/>
  <line x1="10" y1="30.25" x2="90" y2="30.25" stroke="#000" stroke-width="0.5"/>
  <line x1="10" y1="40" x2="90" y2="70" stroke="#000" stroke-width="1"/>
  <circle cx="50" cy="75" r="18" fill="none" stroke="#000" stroke-width="0.75"/>
</svg>
<!-- row 4: viewports, use, symbols -->
<svg id="s-viewbox" style="left:5px;top:341px" width="100" height="60" viewBox="0 0 50 50">
  <rect x="0" y="0" width="50" height="50" fill="#e0e0f0"/>
  <circle cx="25" cy="25" r="20" fill="#3070d0"/>
</svg>
<svg id="s-slice" style="left:117px;top:341px" width="100" height="60" viewBox="0 0 50 50" preserveAspectRatio="xMinYMax slice">
  <rect x="0" y="0" width="50" height="50" fill="#f0e0e0"/>
  <circle cx="25" cy="25" r="20" fill="#d07030"/>
  <rect x="0" y="40" width="10" height="10" fill="#000"/>
</svg>
<svg id="s-par-none" style="left:229px;top:341px" width="100" height="60" viewBox="0 0 50 50" preserveAspectRatio="none">
  <circle cx="25" cy="25" r="20" fill="#30a060"/>
</svg>
<svg id="s-use" style="left:341px;top:341px" width="100" height="100">
  <defs>
    <path id="u-arrow" d="M0 -10 L 20 0 L 0 10 Z"/>
    <g id="u-pair"><rect width="15" height="15"/><rect x="20" width="15" height="15" fill="#000"/></g>
  </defs>
  <use href="#u-arrow" x="10" y="20" fill="#c03030"/>
  <use xlink:href="#u-arrow" x="50" y="20" fill="#3030c0" transform="rotate(20 60 20)"/>
  <use href="#u-pair" x="10" y="50" fill="#30a030"/>
  <use href="#u-pair" x="50" y="75" fill="#a0a030" opacity="0.5"/>
</svg>
<svg id="s-symbol" style="left:453px;top:341px" width="100" height="100">
  <symbol id="u-sym" viewBox="0 0 10 10">
    <circle cx="5" cy="5" r="4"/>
    <rect x="0" y="0" width="3" height="3" fill="#000"/>
  </symbol>
  <use href="#u-sym" x="5" y="5" width="40" height="40" fill="#d05050"/>
  <use href="#u-sym" x="50" y="5" width="45" height="25" fill="#5050d0"/>
  <use href="#u-sym" x="5" y="55" width="90" height="40" fill="#50a050"/>
</svg>
<svg id="s-nested" style="left:565px;top:341px" width="100" height="100">
  <rect width="100" height="100" fill="#f4f4f4"/>
  <svg x="10" y="10" width="50" height="50" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="14" fill="#a04080"/>
  </svg>
  <svg x="55" y="55" width="40" height="40">
    <rect x="-10" y="-10" width="70" height="30" fill="#4080a0"/>
  </svg>
  <svg x="60" y="5" width="30" height="30" overflow="visible">
    <circle cx="30" cy="15" r="12" fill="#408040"/>
  </svg>
</svg>
<svg id="s-percent" style="left:677px;top:341px" width="100" height="80">
  <rect x="10%" y="10%" width="30%" height="25%" fill="#3070d0"/>
  <circle cx="70%" cy="60%" r="20%" fill="#d07030"/>
  <line x1="0" y1="100%" x2="100%" y2="0" stroke="#000" stroke-width="2%"/>
</svg>
<!-- row 5: the cascade -->
<svg id="s-css" style="left:5px;top:453px" width="100" height="100">
  <rect class="warm" x="10" y="10" width="35" height="35"/>
  <rect class="warm big" x="55" y="10" width="35" height="35" fill="blue"/>
  <rect x="10" y="55" width="35" height="35" fill="red"/>
  <rect x="55" y="55" width="35" height="35" style="fill: #9050c0; stroke: #000; stroke-width: 3px" fill="red"/>
</svg>
<svg id="s-current" style="left:117px;top:453px" width="100" height="100" class="tinted">
  <rect x="10" y="10" width="80" height="35" fill="currentColor"/>
  <g style="color: #c03050">
    <circle cx="30" cy="70" r="20" fill="currentColor" stroke="#000" stroke-width="2"/>
    <circle cx="70" cy="70" r="20" fill="none" stroke="currentColor" stroke-width="6"/>
  </g>
</svg>
<svg id="s-inherit" style="left:229px;top:453px" width="100" height="100">
  <g fill="#2070b0" stroke="#000" stroke-width="3" stroke-dasharray="6 3">
    <rect x="10" y="10" width="80" height="30"/>
    <g stroke="#c04000" fill="none">
      <circle cx="30" cy="70" r="18"/>
      <circle cx="70" cy="70" r="18" stroke-dasharray="none" fill="#f0d000"/>
    </g>
  </g>
</svg>
<svg id="s-hidden" style="left:341px;top:453px" width="100" height="100">
  <rect x="10" y="10" width="35" height="35" fill="#000" visibility="hidden"/>
  <g visibility="hidden"><rect x="55" y="10" width="35" height="35" fill="#c00" visibility="visible"/></g>
  <rect x="10" y="55" width="35" height="35" fill="#00c" display="none"/>
  <g display="none"><rect x="55" y="55" width="35" height="35" fill="#0c0"/></g>
  <rect x="30" y="30" width="40" height="40" fill="#e0a000" opacity="0"/>
  <switch><rect x="20" y="60" width="20" height="20" fill="#008080"/><rect x="60" y="60" width="20" height="20" fill="#800000"/></switch>
</svg>
<svg id="s-css-transform" style="left:453px;top:453px" width="100" height="100">
  <rect x="10" y="10" width="30" height="30" fill="#3070d0" style="transform: translate(40px, 0px) rotate(20deg)"/>
  <rect x="10" y="55" width="30" height="30" fill="#d07030" transform="translate(50 0)" style="transform: translateX(10px)"/>
</svg>
<svg id="s-big" style="left:565px;top:453px" width="212" height="130" viewBox="0 0 424 260">
  <path d="M 20 240 L 60 120 L 100 200 L 140 40 L 180 160 L 220 80 L 260 180 L 300 20 L 340 140 L 380 100 L 404 240 Z"
        fill="#b0d0f0" stroke="#203050" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="300" cy="20" r="14" fill="#f04000"/>
</svg>
</body>
</html>
