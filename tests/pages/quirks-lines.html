<html><head><title>Quirks: line heights</title>
<!-- No DOCTYPE: a quirks-mode page. The line height calculation quirk and the blocks ignore
     line-height quirk (the Quirks Mode Standard 3.3, 3.4), as Blink has them: a block's line
     height (its strut) counts only on a line with text of its own -- a word, a space between
     words, a forced break -- or a list item's marker; an inline box's on a line with text in it,
     or a border or padding at its start or end edge there (a margin counts for nothing). -->
<style>
body { font: 16px sans-serif; }
div { margin: 0 0 4px; background: #eee; }
.b { display: inline-block; width: 10px; height: 10px; background: #c00; }
</style></head><body>
