<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSS Masking's mask layers, zoomed</title>
<style>
body { margin: 0; background: #fff }
.cell { position: absolute; width: 104px; height: 84px }
.b { position: absolute; left: 12px; top: 12px; width: 80px; height: 60px; background: linear-gradient(90deg, #e03030, #30c030 50%, #3030e0) }
</style>
</head>
<body>
<svg id="defs" style="position:absolute;left:0;top:0" width="0" height="0">
  <defs><mask id="m"><rect x="0" y="0" width="40" height="30" fill="white"/></mask></defs>
</svg>
<div id="z-down" class="cell" style="left:0;top:0"><div class="b" style="mask-image:linear-gradient(black, transparent)"></div></div>
<div id="z-dot" class="cell" style="left:106px;top:0"><div class="b" style="mask:radial-gradient(circle, black 40%, transparent 41%) center / 40px 40px no-repeat"></div></div>
<div id="z-tiles" class="cell" style="left:212px;top:0"><div class="b" style="mask:radial-gradient(circle, black 45%, transparent 50%) 0 0 / 20px 20px"></div></div>
<div id="z-stripes" class="cell" style="left:318px;top:0"><div class="b" style="mask:repeating-linear-gradient(45deg, black 0 6px, transparent 6px 12px)"></div></div>
<div id="z-place" class="cell" style="left:0;top:86px"><div class="b" style="-webkit-mask:linear-gradient(black, transparent) 10px 5px / 50% 50% no-repeat"></div></div>
<div id="z-content" class="cell" style="left:106px;top:86px"><div class="b" style="mask:linear-gradient(black, transparent) content-box;padding:8px;border:4px solid #333;width:56px;height:36px"></div></div>
<div id="z-svg" class="cell" style="left:212px;top:86px"><div class="b" style="mask:url(#m), linear-gradient(transparent, black)"></div></div>
<div id="z-between" class="cell" style="left:318px;top:86px"><div class="b" style="left:12.5px;top:12.25px;mask:linear-gradient(90deg, black, transparent) intersect, linear-gradient(black, transparent)"></div></div>
</body>
</html>
