<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline SVG: masks</title>
<style>
body { margin: 0; background: #fff }
svg { position: absolute }
.css-mask { mask: url(#k1) }
#k3 { mask-type: alpha }
</style>
</head>
<body>
<svg id="defs" style="left:0;top:0" width="0" height="0">
  <defs>
    <linearGradient id="g1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <radialGradient id="g2"><stop offset="0.4" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="k1"><circle cx="50" cy="50" r="35" fill="#fff"/></mask>
    <mask id="k2"><rect x="0" y="0" width="100" height="100" fill="url(#g1)"/></mask>
    <mask id="k3"><rect x="10" y="10" width="80" height="80" fill="#000" fill-opacity="0.4"/><rect x="30" y="30" width="40" height="40" fill="#0f0"/></mask>
    <mask id="k4" maskUnits="userSpaceOnUse" x="20" y="20" width="60" height="40"><rect x="0" y="0" width="100" height="100" fill="#fff"/></mask>
    <mask id="k5" maskContentUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.4" fill="#fff"/></mask>
    <mask id="k6"><rect x="0" y="0" width="34" height="100" fill="#ff0000"/><rect x="34" y="0" width="33" height="100" fill="#00ff00"/><rect x="67" y="0" width="33" height="100" fill="#0000ff"/></mask>
    <mask id="k7"><rect x="0" y="0" width="100" height="100" fill="#808080"/></mask>
    <mask id="k8" x="0" y="0" width="1" height="1"><rect x="-10" y="-10" width="120" height="120" fill="#fff"/></mask>
    <mask id="k9"><rect x="0" y="0" width="100" height="100" fill="url(#g2)"/><text x="50" y="58" font-size="24" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#000">MASK</text></mask>
    <mask id="k10"><g transform="rotate(45 50 50)"><rect x="25" y="25" width="50" height="50" fill="#fff" opacity="0.7"/></g></mask>
    <mask id="k11" maskUnits="userSpaceOnUse" x="10.5" y="10.25" width="79" height="79.5"><rect x="0" y="0" width="100" height="100" fill="#fff"/></mask>
    <mask id="k12"><circle cx="35" cy="50" r="30" fill="#fff" mask="url(#k1)"/><circle cx="65" cy="50" r="30" fill="#888"/></mask>
  </defs>
</svg>
<!-- row 1: luminance, a gradient, alpha, user space regions, box content, colours' luminance, a grey -->
<svg id="k-circle" style="left:5px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#c02020" mask="url(#k1)"/></svg>
<svg id="k-gradient" style="left:117px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#2020c0" mask="url(#k2)"/></svg>
<svg id="k-alpha" style="left:229px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#20a020" mask="url(#k3)"/></svg>
<svg id="k-userspace" style="left:341px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#a020a0" mask="url(#k4)"/></svg>
<svg id="k-bbox" style="left:453px;top:5px" width="100" height="100"><rect x="20" y="10" width="60" height="80" fill="#208080" mask="url(#k5)"/></svg>
<svg id="k-colours" style="left:565px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#000" mask="url(#k6)"/></svg>
<svg id="k-grey" style="left:677px;top:5px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#000" mask="url(#k7)"/></svg>
<!-- row 2: a group masked, CSS's mask, the region cut, opacity, text in a mask, a turned mask, a fractional region -->
<svg id="k-group" style="left:5px;top:117px" width="100" height="100"><g mask="url(#k1)"><rect x="0" y="0" width="60" height="60" fill="#e08000"/><rect x="40" y="40" width="60" height="60" fill="#0080e0"/></g></svg>
<svg id="k-css" style="left:117px;top:117px" width="100" height="100"><rect class="css-mask" x="0" y="0" width="100" height="100" fill="#606000"/></svg>
<svg id="k-region" style="left:229px;top:117px" width="100" height="100"><rect x="10" y="10" width="80" height="80" fill="#000" stroke="#f00" stroke-width="10" mask="url(#k8)"/></svg>
<svg id="k-opacity" style="left:341px;top:117px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#c02020" mask="url(#k1)" opacity="0.5"/></svg>
<svg id="k-text" style="left:453px;top:117px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#204080" mask="url(#k9)"/></svg>
<svg id="k-turned" style="left:565px;top:117px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#008040" mask="url(#k10)"/></svg>
<svg id="k-fraction" style="left:677px;top:117px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#20a020" mask="url(#k11)"/></svg>
<!-- row 3: a mask's content masked, a clip and a mask together, a missing mask -->
<svg id="k-nested" style="left:5px;top:229px" width="100" height="100"><rect x="0" y="0" width="100" height="100" fill="#802020" mask="url(#k12)"/></svg>
<svg id="k-clipped" style="left:117px;top:229px" width="100" height="100"><clipPath id="kc"><rect x="0" y="0" width="50" height="100"/></clipPath><rect x="0" y="0" width="100" height="100" fill="#2060c0" mask="url(#k1)" clip-path="url(#kc)"/></svg>
<svg id="k-missing" style="left:229px;top:229px" width="100" height="100"><rect x="10" y="10" width="80" height="80" fill="#c08020" mask="url(#nosuch)"/></svg>
</body>
</html>
