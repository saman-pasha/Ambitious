<!DOCTYPE html>
<html lang="en"><head><title>Images displayed as blocks</title>
<style>
body { margin: 8px; }
img { display: block; }
.row { display: flex; }
.row img { display: inline; }
</style></head>
<body>
<p id="p1">Images displayed as blocks, sized as an inline image is, their margins a block's.</p>
<img id="b-auto" src="logo.png" alt="Logo">
<img id="b-center" src="logo.png" alt="Logo" style="margin: 0 auto">
<img id="b-right" src="logo.png" alt="Logo" style="margin-left: auto">
<img id="b-width" src="logo.png" alt="Logo" style="width: 200px">
<img id="b-pct" src="logo.png" alt="Logo" style="width: 50%">
<img id="b-height" src="logo.png" alt="Logo" style="height: 64px">
<img id="b-max" src="logo.png" alt="Logo" style="width: 1000px; max-width: 100%">
<img id="b-min" src="logo.png" alt="Logo" style="min-width: 300px">
<img id="b-edges" src="logo.png" alt="Logo" style="border: 5px solid #333; padding: 3px; margin: 4px 0">
<img id="b-bbox" src="logo.png" alt="Logo" style="box-sizing: border-box; width: 120px; border: 4px solid #333">
<div id="d-after">Text after the images.</div>
<img id="f-left" src="logo.png" alt="Logo" style="float: left; margin-right: 10px"><p id="p-float">A floated image, with this text beside it, and the text runs on along it.</p>
<div class="row" id="row"><img id="r-item" src="logo.png" alt="Logo"><img id="r-item2" src="logo.png" alt="Logo" style="height: 48px"></div>
<div style="position: relative; height: 60px" id="rel"><img id="a-pos" src="logo.png" alt="Logo" style="position: absolute; left: 20px; top: 10px"><img id="a-both" src="logo.png" alt="Logo" style="position: absolute; left: 0; right: 0; top: 10px; margin: 0 auto"></div>
</body></html>
