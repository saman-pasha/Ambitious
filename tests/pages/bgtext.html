<!DOCTYPE html>
<html><head><title>Backgrounds clipped to text, and the text's fill</title>
<style>
body { margin: 8px; background: #fff; font-family: sans-serif; }
h1 { margin: 0 0 8px; font-size: 64px; line-height: 1.1; }
#grad { background: linear-gradient(90deg, #e3342f, #3490dc); -webkit-background-clip: text; background-clip: text; color: transparent; }
#text-fill { background: linear-gradient(180deg, #38c172, #1f2d3d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#image { font-size: 56px; font-weight: bold; background: url(../images/j_photo.jpg) 0 0 / 220px auto; -webkit-background-clip: text; color: transparent; margin: 0 0 8px; }
#colour { font-size: 40px; background-color: #f6993f; background-clip: text; color: transparent; margin: 0 0 8px; }
#nested { font-size: 32px; background: repeating-linear-gradient(45deg, #9561e2 0 10px, #f66d9b 10px 20px); background-clip: text; color: transparent; margin: 0 0 8px; }
#nested p { margin: 0; }
#text-inherit { font-size: 28px; -webkit-text-fill-color: #6574cd; margin: 0 0 8px; }
#text-inherit span { color: #e3342f; text-decoration: underline; }
#prefixed { -webkit-box-sizing: border-box; -webkit-border-radius: 12px; border: 4px solid #3490dc; width: 300px; height: 48px; padding: 4px; margin: 0; -webkit-box-shadow: 4px 4px 0 #f6993f; }
</style></head>
<body>
<h1 id="grad">Gradient text</h1>
<h1 id="text-fill">Filled by the gradient</h1>
<div id="image">Photo inside letters</div>
<div id="colour">A colour clipped</div>
<div id="nested">Outer <span>span</span><p>and a child paragraph</p></div>
<div id="text-inherit">Fill inherited <span>by a red span</span></div>
<div id="prefixed"></div>
</body></html>
