<!DOCTYPE html>
<html lang="en"><head><title>Legends</title>
<style>body { margin: 8px; font: 16px sans-serif; } legend { color: transparent; }</style></head>
<body>
<fieldset id="f1"><legend id="l1">Plain legend</legend><p id="p1">Content</p></fieldset>
<fieldset id="f2" style="border: 6px solid #36c; padding: 10px"><legend id="l2" style="padding: 0 4px">Thick border</legend><div id="c2">Content</div></fieldset>
<fieldset id="f3"><legend id="l3" style="font-size: 32px">Big legend</legend><div id="c3">Content</div></fieldset>
<fieldset id="f4"><div id="c4">No legend</div></fieldset>
<fieldset id="f5" style="width: 300px"><legend id="l5" style="margin-left: auto; margin-right: 20px">Right</legend><div id="c5">Content</div></fieldset>
<fieldset id="f6"><legend id="l6" style="border: 3px solid red; padding: 5px">Bordered legend</legend><div id="c6">Content</div></fieldset>
</body></html>
