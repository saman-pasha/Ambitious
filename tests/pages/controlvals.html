<!DOCTYPE html>
<html lang="en"><head><title>Form controls' computed values from the user agent sheet</title></head><body>
<input id="text" data-check="appearance border-top-style border-top-width border-top-color background-color color font-size font-family padding-top padding-left display margin-top">
<textarea id="area" data-check="appearance border-top-style border-top-width border-top-color background-color font-family padding-top white-space"></textarea>
<select id="menu" data-check="appearance border-top-style border-top-width border-top-color background-color padding-top box-sizing"><option>a</option></select>
<button id="button" data-check="appearance border-top-style border-top-width border-top-color background-color color padding-left text-align box-sizing">b</button>
<input id="submit" type="submit" data-check="appearance border-top-style border-top-color padding-left text-align box-sizing">
<input id="check" type="checkbox" data-check="appearance margin-top margin-left margin-bottom border-top-style box-sizing">
<input id="radio" type="radio" data-check="appearance margin-top margin-left margin-bottom">
<input id="range" type="range" data-check="appearance margin-top color border-top-style">
<input id="colour" type="color" data-check="appearance width height border-top-style border-top-width border-top-color padding-top padding-left box-sizing">
<input id="date" type="date" data-check="appearance font-family border-top-style padding-top padding-left">
<input id="none" style="-webkit-appearance: none" data-check="appearance">
<input id="none2" style="appearance: none" data-check="appearance">
<div id="div" data-check="appearance"></div>
</body></html>
