<!DOCTYPE html>
<html lang="en"><head><title>The old box and the line clamp: computed values</title><style>
body { margin: 8px; font: 16px/20px sans-serif; }
div { width: 200px; }
.v { -webkit-box-orient: vertical; }
.n { -webkit-line-clamp: 2; }
</style></head><body>
<div id="b1" data-check="display -webkit-box-orient -webkit-line-clamp" style="display: -webkit-box">old box</div>
<div id="b2" data-check="display -webkit-box-orient -webkit-line-clamp" class="v" style="display: -webkit-box">vertical, no clamp</div>
<div id="b3" data-check="display -webkit-box-orient -webkit-line-clamp" class="n" style="display: -webkit-box">horizontal, a clamp</div>
<div id="b4" data-check="display -webkit-box-orient -webkit-line-clamp" class="v n" style="display: -webkit-box">vertical, a clamp</div>
<div id="b5" data-check="display -webkit-box-orient -webkit-line-clamp" style="display: -webkit-inline-box">inline</div>
<div id="b6" data-check="display -webkit-box-orient -webkit-line-clamp" class="v n" style="display: -webkit-inline-box">inline, vertical, a clamp</div>
<div id="b7" data-check="display -webkit-box-orient -webkit-line-clamp" class="v" style="display: -webkit-box; -webkit-line-clamp: none">clamp none</div>
<div id="b8" data-check="display -webkit-box-orient -webkit-line-clamp" class="v n">a block</div>
<div id="b9" data-check="display -webkit-box-orient -webkit-line-clamp" class="n" style="display: -webkit-box; -webkit-box-orient: block-axis">block-axis</div>
<div id="b10" data-check="display -webkit-box-orient" style="display: -webkit-box; -webkit-box-orient: inline-axis">inline-axis</div>
<div id="b11" data-check="display" style="display: -webkit-inline-box; float: left">floated</div>
<div id="b12" data-check="display" class="v n" style="display: -webkit-inline-box; float: left">floated, clamped</div>
<div id="b13" data-check="display" class="v n" style="display: -webkit-inline-box; position: absolute; top: 400px">positioned, clamped</div>
<div style="display: flex"><div id="b14" data-check="display" class="v n" style="display: -webkit-inline-box">flex item, clamped</div></div>
<div id="b15" data-check="display" class="v n" style="display: flow-root">flow-root</div>
<div style="display: -webkit-box"><span id="b16" data-check="display">child</span></div>
<div id="c1" data-check="-webkit-line-clamp" style="-webkit-line-clamp: 0">0</div>
<div id="c2" data-check="-webkit-line-clamp" style="-webkit-line-clamp: -1">-1</div>
<div id="c3" data-check="-webkit-line-clamp" style="-webkit-line-clamp: 2.5">2.5</div>
<div id="c4" data-check="-webkit-line-clamp" style="-webkit-line-clamp: 1">1</div>
<div id="c5" data-check="-webkit-line-clamp" style="-webkit-line-clamp: 2 2">2 2</div>
<div id="t1" data-check="text-overflow" style="text-overflow: ellipsis">ellipsis</div>
<div id="t2" data-check="text-overflow" style="text-overflow: clip">clip</div>
<div id="t3" data-check="text-overflow" style="text-overflow: '--'">a string</div>
<div id="t4" data-check="text-overflow" style="text-overflow: ellipsis ellipsis">two</div>
<div id="t5" data-check="text-overflow" style="text-overflow: fade">fade</div>
</body></html>
