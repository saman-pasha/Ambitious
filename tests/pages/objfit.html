<!DOCTYPE html>
<html lang="en"><head><title>object-fit and object-position</title>
<style>
body { margin: 0; font: 16px serif; }
div { position: absolute; }
img { display: block; width: 60px; height: 60px; background: #ddd; }
</style></head>
<body>
<div style="left:10px;top:10px"><img id="f1" src="logo.png"></div>
<div style="left:90px;top:10px"><img id="f2" src="logo.png" style="object-fit:contain"></div>
<div style="left:170px;top:10px"><img id="f3" src="logo.png" style="object-fit:cover"></div>
<div style="left:250px;top:10px"><img id="f4" src="logo.png" style="object-fit:none"></div>
<div style="left:330px;top:10px"><img id="f5" src="logo.png" style="object-fit:scale-down"></div>
<div style="left:410px;top:10px"><img id="f6" src="logo.png" style="object-fit:scale-down;width:120px"></div>
<div style="left:550px;top:10px"><img id="f7" src="logo.png" style="object-fit:cover;object-position:left top"></div>
<div style="left:630px;top:10px"><img id="f8" src="logo.png" style="object-fit:contain;object-position:right bottom"></div>
<div style="left:10px;top:100px"><img id="f9" src="logo.png" style="object-fit:none;object-position:10px 5px"></div>
<div style="left:90px;top:100px"><img id="f10" src="logo.png" style="object-fit:cover;object-position:calc(100% - 5px) 0"></div>
<div style="left:170px;top:100px"><img id="f11" src="logo.png" style="object-fit:contain;padding:5px;border:2px solid navy"></div>
<div style="left:260px;top:100px"><img id="f12" src="logo.png" style="object-fit:cover;width:50px;height:50px;border-radius:50%"></div>
<div style="left:330px;top:100px"><img id="f13" src="logo.png" style="object-fit:contain;width:70px;height:30px"></div>
<div style="left:420px;top:100px"><img id="f14" src="logo.png" style="object-fit:none;object-position:right 10px top 5px;width:50px;height:20px"></div>
<div style="left:490px;top:100px"><img id="f15" srcset="logo.png 2x" style="object-fit:none"></div>
<div style="left:570px;top:100px"><img id="f16" src="logo.png" style="object-fit:fill;object-position:left top"></div>
<div style="left:650px;top:100px"><img id="f17" src="logo.png" style="object-fit:cover;object-position:25% 75%;width:40px;height:70px"></div>
<div style="left:10px;top:190px"><img id="f18" src="logo.png" style="object-fit:contain;object-position:0 0;width:100px;height:100px;box-sizing:border-box;padding:10px"></div>
<div style="left:130px;top:190px"><img id="f19" src="logo.png" style="object-fit:none;object-position:-10px -5px"></div>
<div style="left:210px;top:190px"><img id="f20" src="logo.png" style="object-fit:cover;opacity:0.5"></div>
<div style="left:290px;top:190px"><img id="f21" src="logo.png" style="object-fit:contain;object-position:center top"></div>
<div style="left:370px;top:190px"><img id="f22" src="logo.png" style="object-fit:contain;background:none"></div>
<div style="left:450px;top:190px"><img id="f23" src="logo.png" style="object-position:right top;background:none;width:40px;height:40px;object-fit:none"></div>
</body></html>
