<!DOCTYPE html>
<html>
<head>
<title>Animations drawn</title>
<style>
/* tests/pages/animpaint.html: animated boxes as the page is drawn at rest, 10 s after it
   was loaded (Chromium's screenshot taken with each running animation at 10,000 ms:
   tools/bench/shot.js --at 10000), each case in a cell of its own (the cell, which has the
   id, is the region tests/integ/paintref.sh compares): transforms mixed function by
   function (a spinner, a move and a scale, from none), a shadow, a filter, colours,
   sizes, opacity. No text */
body { margin: 0; background: white }
.cell { display: inline-block; width: 150px; height: 90px; padding: 25px; margin: 0; vertical-align: top }
.box { width: 150px; height: 90px; box-sizing: border-box; background: linear-gradient(90deg, #e33 0 25%, #3b3 0 50%, #36e 0 75%, #fc3 0); border: 6px solid #222 }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes move { from { transform: translate(-40px, 10px) scale(0.5) } to { transform: translate(40px, -10px) scale(1) } }
@keyframes tilt { from { transform: none } to { transform: rotate(40deg) skewX(20deg) } }
@keyframes glow { from { box-shadow: 0 0 0 rgba(0, 0, 0, 0.8) } to { box-shadow: 12px 12px 16px rgba(200, 0, 0, 0.6) } }
@keyframes soft { from { filter: blur(0px) grayscale(0) } to { filter: blur(6px) grayscale(1) } }
@keyframes tint { 0% { background: #e33 } 50% { background: #3b3 } 100% { background: #36e } }
@keyframes size { from { width: 20px; height: 20px } to { width: 150px; height: 90px } }
@keyframes appear { from { opacity: 0 } to { opacity: 1 } }
@keyframes round { from { border-radius: 0 } to { border-radius: 45px } }
</style>
</head>
<body>
<div class=cell id=spin><div class=box style="animation: spin 3s linear infinite"></div></div><div class=cell id=move><div class=box style="animation: move 20s linear"></div></div><div class=cell id=tilt><div class=box style="animation: tilt 20s ease-in-out"></div></div><div class=cell id=glow><div class=box style="animation: glow 20s linear"></div></div>
<div class=cell id=soft><div class=box style="animation: soft 20s linear"></div></div><div class=cell id=tint><div class=box style="animation: tint 40s linear"></div></div><div class=cell id=size><div class=box style="animation: size 20s ease-out"></div></div><div class=cell id=appear><div class=box style="opacity: 0; animation: appear 15s linear forwards 2s"></div></div>
<div class=cell id=round><div class=box style="animation: round 30s steps(3)"></div></div><div class=cell id=gone><div class=box style="animation: appear 1s reverse forwards"></div></div>
</body>
</html>
