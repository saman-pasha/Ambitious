<!DOCTYPE html>
<html lang="en"><head><title>image-rendering's values</title></head>
<body>
<div id="v-auto" data-check="image-rendering"></div>
<div id="v-pix" style="image-rendering: pixelated" data-check="image-rendering"></div>
<div id="v-crisp" style="image-rendering: crisp-edges" data-check="image-rendering"></div>
<div id="v-webkit" style="image-rendering: -webkit-optimize-contrast" data-check="image-rendering"></div>
<div id="v-smooth" style="image-rendering: smooth" data-check="image-rendering"></div>
<div id="v-hq" style="image-rendering: high-quality" data-check="image-rendering"></div>
<div id="v-speed" style="image-rendering: optimizeSpeed" data-check="image-rendering"></div>
<div id="v-quality" style="image-rendering: optimizeQuality" data-check="image-rendering"></div>
<div id="v-upper" style="image-rendering: PIXELATED" data-check="image-rendering"></div>
<div style="image-rendering: pixelated"><span id="v-inh" data-check="image-rendering"></span><span id="v-init" style="image-rendering: initial" data-check="image-rendering"></span></div>
<div style="image-rendering: crisp-edges"><span id="v-inh2" style="image-rendering: inherit" data-check="image-rendering"></span><span id="v-unset" style="image-rendering: unset" data-check="image-rendering"></span></div>
</body></html>
