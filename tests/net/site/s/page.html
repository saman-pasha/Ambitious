<!DOCTYPE html>
<html lang="en">
<head>
<title>Images chosen from their srcset</title>
</head>
<body>
<!-- each case its own files, so that no image another case loaded is in a cache to sway the choice -->
<img id="x" srcset="x-1x.png 1x, x-2x.png 2x" alt="x descriptors">
<img id="w" srcset="w-400w.png 400w, w-800w.png 800w, w-1600w.png 1600w" alt="w descriptors, sizes 100vw">
<img id="half" srcset="half-400w.png 400w, half-800w.png 800w, half-1600w.png 1600w" sizes="50vw" alt="sizes 50vw">
<img id="media" srcset="media-400w.png 400w, media-800w.png 800w, media-1600w.png 1600w" sizes="(max-width: 600px) 480px, 800px" alt="a media condition that fails">
<img id="narrow" srcset="narrow-400w.png 400w, narrow-800w.png 800w, narrow-1600w.png 1600w" sizes="(min-width: 700px) 300px, 100vw" alt="a media condition that holds">
<img id="calc" srcset="calc-400w.png 400w, calc-800w.png 800w, calc-1600w.png 1600w" sizes="calc(100vw - 200px)" alt="sizes calc()">
<img id="em" srcset="em-400w.png 400w, em-800w.png 800w, em-1600w.png 1600w" sizes="(max-width: 40em) 100vw, 25em" alt="sizes in em">
<img id="src" src="src-1x.png" srcset="src-2x.png 2x, src-3x.png 3x" alt="src as 1x">
<img id="above" srcset="above-1.5x.png 1.5x, above-3x.png 3x" alt="the least density above 1">
<img id="below" srcset="below-0.5x.png 0.5x" alt="only a density below 1">
<img id="bare" src="bare-src.png" srcset="bare-1x.png" alt="no descriptor, 1x">
<img id="bad" srcset="bad-2y.png 2y, bad-1x.png 1x" alt="a bad descriptor">
<img id="comma" srcset="comma-1,x.png 1x,comma-2x.png 2x" alt="a comma in a URL">
<img id="mixed" srcset="mixed-400w.png 400w, mixed-2x.png 2x" sizes="800px" alt="w and x together">
</body>
</html>
